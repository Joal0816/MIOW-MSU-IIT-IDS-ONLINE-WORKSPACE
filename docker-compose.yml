services:
  postgres:
    image: postgres:16-alpine
    container_name: miow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: miow
      POSTGRES_PASSWORD: miow_dev_password
      POSTGRES_DB: miow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Optional: auto-run migrations on first start (copy SQL files)
      # - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miow -d miow"]
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  pgdata:
